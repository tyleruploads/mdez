name: Compile and Release MDEZ++
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  compile:
    name: Compile (${{ matrix.target_name }})
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target_name: mdez-linux
            binary_path: build/mdez
            artifact_path: build/MDEZ++-x86_64.AppImage
          - os: windows-latest
            target_name: mdez-windows
            binary_path: build/Release/mdez-windows.exe
            artifact_path: build/Release/mdez-windows.zip
          - os: ubuntu-22.04
            target_name: mdez-wasm
            qt_arch: wasm_singlethread
            emsdk_version: 3.1.56
            artifact_path: build-wasm/mdez-wasm.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          install-deps: 'true'
          set-env: 'true'
          cache: 'true'
          cache-key-prefix: 'qt-binaries'

      - name: Install Qt WebAssembly Module
        if: matrix.target_name == 'mdez-wasm'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: all_os
          target: 'wasm'
          arch: ${{ matrix.qt_arch }}
          install-deps: 'true'
          set-env: 'false'

      - name: Setup Emscripten SDK
        if: matrix.target_name == 'mdez-wasm'
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ matrix.emsdk_version }}
          emscripten-cache-folder: 'emsdk-cache'

      - name: Install Ninja
        if: matrix.target_name == 'mdez-wasm'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Compile MDEZ++ (WASM)
        if: matrix.target_name == 'mdez-wasm'
        run: |
          export EMSDK=$EMSDK

          QT_HOST_DIR=$QT_ROOT_DIR
          QT_WASM_DIR=$(dirname $QT_HOST_DIR)/wasm_singlethread

          chmod +x $QT_WASM_DIR/bin/qt-cmake

          $QT_WASM_DIR/bin/qt-cmake -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH=$QT_HOST_DIR \
            -DQT_CHAINLOAD_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake

          cmake --build build-wasm --config Release

          cd build-wasm
          zip -r ../mdez-wasm.zip *
          cd ..

      - name: Compile MDEZ++
        if: matrix.target_name != 'mdez-wasm'
        run: |
          cmake -B build -DOUTPUT_NAME=mdez
          cmake --build build --config Release

      - name: Package Linux Binary into Standalone AppImage
        if: matrix.target_name == 'mdez-linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage

          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          echo "[Desktop Entry]" > mdez.desktop
          echo "Type=Application" >> mdez.desktop
          echo "Name=MDEZ++" >> mdez.desktop
          echo "Comment=A lightweight C++20 and Qt GUI Markdown editor" >> mdez.desktop
          echo "Exec=mdez" >> mdez.desktop
          echo "Icon=mdez-icon" >> mdez.desktop
          echo "Terminal=false" >> mdez.desktop
          echo "Categories=Utility;" >> mdez.desktop


          export QMAKE=$QT_ROOT_DIR/bin/qmake
          export EXTRA_QT_PLUGIN_ARGS="--appimage-extract-and-run"

          VERSION=${{ github.sha }} ./linuxdeploy-x86_64.AppImage \
          --appimage-extract-and-run \
          --appdir=AppDir \
          --executable=build/mdez \
          --desktop-file=mdez.desktop \
          --icon-file=${{ github.workspace }}/media/docs/mdez-icon.png \
          --plugin=qt \
          --output=appimage

          mv MDEZ++-*.AppImage ${{ matrix.artifact_path }}

      - name: Prepare Standalone Windows Executable
        if: matrix.target_name == 'mdez-windows'
        run: |
          windeployqt --release --compiler-runtime --no-svg ${{ matrix.binary_path }}

          7z a -r ${{ matrix.artifact_path }} build/Release/*

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target_name }}
          path: ${{ matrix.artifact_path }}

  release:
    name: Publish Release
    needs: compile
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux and Windows Artifact
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          pattern: binary-*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MDEZ++-x86_64.AppImage
            mdez-windows.zip
            mdez-wasm.zip
          generate_release_notes: true
