name: Compile and Release MDEZ++
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  compile:
    name: Compile (${{ matrix.target_name }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target_name: mdez-linux
            binary_path: build/mdez-linux
          - os: windows-latest
            target_name: mdez-windows
            binary_path: build/Release/mdez-windows.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          install-deps: 'true'
          set-env: 'true'

      - name: Compile MDEZ++
        run: |
          cmake -B build -DOUTPUT_NAME=${{ matrix.target_name }}
          cmake --build build --config Release

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target_name }}
          path: ${{ matrix.binary_path }}

  release:
    name: Publish Release
    needs: compile
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mdez-linux
            mdez-windows.exe
          generate_release_notes: true
