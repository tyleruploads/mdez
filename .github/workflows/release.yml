name: Compile and Release MDEZ++
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  compile:
    name: Compile (${{ matrix.target_name }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target_name: mdez-linux
            binary_path: build/mdez-linux
            artifact_path: build/MDEZ++-x86_64.AppImage
          - os: windows-latest
            target_name: mdez-windows
            binary_path: build/Release/mdez-windows.exe
            artifact_path: build/Release/mdez-windows.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        name: Checkout

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          install-deps: 'true'
          set-env: 'true'
          cache: 'true'
          cache-key-prefix: 'qt-binaries'

      - name: Compile MDEZ++
        run: |
          cmake -B build -DOUTPUT_NAME=${{ matrix.target_name }}
          cmake --build build --config Release

      - name: Package Linux Binary into Standalone AppImage
        if: matrix.target_name == 'mdez-linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage

          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

          echo "[Desktop Entry]" > mdez-linux.desktop
          echo "Type=Application" >> mdez-linux.desktop
          echo "Name=MDEZ++" >> mdez-linux.desktop
          echo "Exec=mdez-linux" >> mdez-linux.desktop
          echo "Icon=mdez-linux" >> mdez-linux.desktop
          echo "Categories=Utility;" >> mdez-linux.desktop


          export QMAKE=$QT_ROOT_DIR/bin/qmake
          export EXTRA_QT_PLUGIN_ARGS="--appimage-extract-and-run"

          VERSION=${{ github.sha }} ./linuxdeploy-x86_64.AppImage \
          --appimage-extract-and-run \
          --appdir=AppDir \
          --executable=build/mdez-linux \
          --desktop-file=mdez-linux.desktop \
          --icon-file=${{ github.workspace }}/media/docs/mdez-linux.png \
          --plugin=qt \
          --output=appimage

          mv MDEZ++-*.AppImage ${{ matrix.artifact_path }}


      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target_name }}
          path: ${{ matrix.artifact_path }}

  release:
    name: Publish Release
    needs: compile
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact_path }}
            mdez-windows.exe
          generate_release_notes: true
