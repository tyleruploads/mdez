app-id: io.github.tyleruploads.mdez
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: mdez
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
modules:
  - name: mdez
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://api.github.com/repos/tyleruploads/mdez/tarball/v0.15.0
        sha256: 39b38ee417583922c6a0ff0a4bc517e9ac6eb4ed7b98b7a21fe2b669daf7a6e3
        dest-filename: mdez.tar.gz
        x-checker-data:
          type: json
          url: https://api.github.com/repos/tyleruploads/mdez/releases/latest
          version-query: .tag_name
          url-query: .tarball_url
          is-main-source: true
