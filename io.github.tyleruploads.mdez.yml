app-id: io.github.tyleruploads.mdez
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: mdez
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
modules:
  - name: mdez
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/tyleruploads/mdez/archive/refs/tags/v0.13.0.tar.gz
        sha256: acc7eb842bc53478f60b185e4e6f8aa5028f80b1f1595f8fcc3fb55761a1f62f
        x-checker-data:
          type: json
          url: https://api.github.com/repos/tyleruploads/mdez/releases/latest
          version-query: .tag_name
          url-query: .tarball_url
          is-main-source: true
