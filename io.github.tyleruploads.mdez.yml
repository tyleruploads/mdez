app-id: io.github.tyleruploads.mdez
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: mdez
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
modules:
  - name: mdez
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/tyleruploads/mdez/archive/refs/tags/v0.14.0.tar.gz
        sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        x-checker-data:
          type: json
          url: https://api.github.com/repos/tyleruploads/mdez/releases/latest
          version-query: .tag_name
          url-query: .tarball_url
          is-main-source: true
